# .github/workflows/ci.yml
name: Enterprise RAG CI Pipeline

# Trigger this workflow on pushes or pull requests to the main branch
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  # Job 1: Build and lint Frontend
  build-frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies and Build
        working-directory: ./frontend
        run: |
          npm ci
          npm run build
          
  # Job 2: Build .NET Backend
  build-backend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET Core
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore and Build
        working-directory: ./backend-dotnet/BackendApi
        run: |
          dotnet restore
          dotnet build --configuration Release --no-restore

  # Job 3: Setup AI Service (Python)
  build-ai-service:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Zip the application (Source Code ONLY)
        working-directory: ./ai-service
        # 只把当前目录的代码打包，严格排除可能残存的虚拟环境和缓存
        run: zip -r ../release.zip ./* -x "venv/*" "__pycache__/*"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ai-service-app
          path: release.zip
          
  # Job 4: Mock Deployment (Runs only if all builds pass)
  deploy-backend:
    needs: build-backend
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Build and Publish
        working-directory: ./backend-dotnet/BackendApi
        run: dotnet publish -c Release -o ./publish
      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'erag-backend-api'
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE_DOTNET }}
          package: ./backend-dotnet/BackendApi/publish

  deploy-ai-service:
    needs: build-ai-service
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Download Artifact
        uses: actions/download-artifact@v4
        with:
          name: ai-service-app

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'erag-ai-service'
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE_PYTHON }}
          package: release.zip